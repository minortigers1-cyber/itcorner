name: IPTV Auto Merge

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch:      

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Merger
        # CHECK: Ensure your python file is actually named 'main.py'
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          
          # 1. Stage the file
          git add all_channels.m3u
          
          # 2. Check if there are actual changes before committing
          if git diff --staged --quiet; then
            echo "No changes detected in playlist. Skipping commit."
          else
            git commit -m "Auto Update $(date)"
            git push origin HEAD
          fi