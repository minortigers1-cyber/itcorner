name: Update IPTV Playlist

on:
  schedule:
    # Runs every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add all_channels.m3u groups/*.m3u
        # Only commit if there are changes to avoid workflow errors
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update Playlists $(date)" && git push)