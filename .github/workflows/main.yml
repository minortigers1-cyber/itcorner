user.emailname: Update My IPTV List
on:
  schedule:
    - cron: '0 0 * * *' # Runs every 24 hours
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Run Merge Script
        run: python update_playlist.py

     - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          git commit -m "Update IPTV Playlist" || exit 0
          # We use the GITHUB_TOKEN to bypass the 128 error
          git push https://${{ attrs.github_token }}@github.com/${{ github.repository }}.git HEAD:main