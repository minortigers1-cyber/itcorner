# ... previous steps (Checkout, Python, Run Scraper) ...

    permissions:
      contents: write  # Crucial for allowing the bot to push code

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Scraper
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Add all generated files
        git add all_channels.m3u
        git add groups/*.m3u
        
        # Check if there are actually changes to avoid 'empty commit' errors
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated Playlist Update: $(date +'%Y-%m-%d %H:%M')"
          git push
        fi