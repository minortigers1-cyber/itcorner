<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Play - IT Corner</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #0a0a0a; --sidebar: #151515; --accent: #00ff88; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 350px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid #333; }
        .header { padding: 20px; background: #111; border-bottom: 1px solid var(--accent); }
        .header h2 { margin: 0 0 10px 0; color: var(--accent); font-size: 22px; }
        
        input { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; margin-bottom: 10px; box-sizing: border-box; font-size: 12px; }
        button { width: 100%; padding: 10px; background: var(--accent); border: none; color: #000; border-radius: 4px; cursor: pointer; font-weight: bold; }

        #channelList { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .channel { padding: 12px; margin-bottom: 5px; background: #1e1e1e; border-radius: 4px; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .channel:hover { background: #252525; border-left-color: var(--accent); }

        #main { flex-grow: 1; display: flex; flex-direction: column; background: #000; }
        #video-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; background: #000; }
        
        .info-bar { padding: 15px; background: #111; font-size: 14px; border-top: 1px solid #333; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 40vh; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <h2>IT Corner IPTV</h2>
        <input type="text" id="urlInput" value="https://raw.githubusercontent.com/minortigers1-cyber/itcorner/main/playlist.m3u">
        <button onclick="fetchPlaylist()">Refresh Channels</button>
    </div>
    <div id="channelList">
        <p style="text-align:center; color:#888;">Loading channels...</p>
    </div>
</div>

<div id="main">
    <div id="video-container">
        <video id="video" controls playsinline></video>
    </div>
    <div class="info-bar" id="status">Select a channel to play</div>
</div>

<script>
    const video = document.getElementById('video');
    const hls = new Hls();

    // Load playlist automatically on start
    window.onload = () => {
        fetchPlaylist();
    };

    async function fetchPlaylist() {
        const url = document.getElementById('urlInput').value;
        const listContainer = document.getElementById('channelList');
        
        try {
            // Using a CORS proxy to ensure the GitHub link loads properly
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxyUrl);
            const data = await response.json();
            parseM3U(data.contents);
        } catch (error) {
            listContainer.innerHTML = "<p style='color:red; padding:10px;'>Error: Could not load playlist.</p>";
        }
    }

    function parseM3U(content) {
        const container = document.getElementById('channelList');
        container.innerHTML = '';
        const lines = content.split('\n');
        
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].startsWith('#EXTINF')) {
                const info = lines[i];
                const name = info.substring(info.lastIndexOf(',') + 1);
                const streamUrl = lines[i + 1]?.trim();
                
                if (streamUrl && streamUrl.startsWith('http')) {
                    const div = document.createElement('div');
                    div.className = 'channel';
                    div.innerHTML = `<strong>▶</strong> ${name}`;
                    div.onclick = () => playStream(streamUrl, name);
                    container.appendChild(div);
                }
            }
        }
    }

    function playStream(url, name) {
        document.getElementById('status').innerHTML = `<strong>NOW PLAYING:</strong> ${name}`;
        
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }
</script>

</body>
</html>
